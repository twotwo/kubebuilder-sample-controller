# This rule is not used by the project kubebuilder-sample-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to samplecontroller.github.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kubebuilder-sample-controller
    app.kubernetes.io/managed-by: kustomize
  name: expelorcs-viewer-role
rules:
- apiGroups:
  - samplecontroller.github.com
  resources:
  - expelorcs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - samplecontroller.github.com
  resources:
  - expelorcs/status
  verbs:
  - get
