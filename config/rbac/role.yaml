---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - samplecontroller.github.com
  resources:
  - expelorcs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - samplecontroller.github.com
  resources:
  - expelorcs/finalizers
  verbs:
  - update
- apiGroups:
  - samplecontroller.github.com
  resources:
  - expelorcs/status
  verbs:
  - get
  - patch
  - update
